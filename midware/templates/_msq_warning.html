<article id="msq-warning" class="flash flash-warning" hidden>
  <div class="msq-warning-row">
    <span>
      <strong>MSQ spends tokens.</strong> Each recorder sends a real request to your
      provider on a schedule (hourly by default), so probes count against your API
      account, token budget and rate limits. Make sure the account can absorb the
      extra traffic before enabling recorders.
    </span>
    <button type="button" class="outline secondary" id="msq-warning-dismiss">Dismiss</button>
  </div>
</article>
